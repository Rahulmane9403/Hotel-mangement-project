<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold">
    <i class="bi bi-grid-3x3-gap me-2"></i> Amenities
  </h3>

  <!-- <button class="btn btn-primary" (click)="openAddAmenity()">
    <i class="bi bi-plus-circle me-1"></i> Add Amenity
  </button> -->
  <button class="btn btn-primary mb-3" (click)="openAddAmenity()">
  <i class="bi bi-plus-circle me-1"></i>
  Add Amenity
</button>

</div>
<div class="row mb-3 align-items-center">

  <!-- Search -->
  <div class="col-md-6">
    <input
      type="text"
      class="form-control"
      placeholder="Search amenities..."
      [(ngModel)]="searchText"
      (input)="applyFilters()">
  </div>

  <!-- Status Filter -->
  <div class="col-md-4">
    <select
      class="form-select"
      [(ngModel)]="statusFilter"
      (change)="applyFilters()">
      <option value="all">All Status</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>

</div>

<!-- Loading -->
<div *ngIf="loading" class="text-center my-5">
  <div class="spinner-border text-primary"></div>
</div>

<!-- Error -->
<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

  (formSubmitted)="onAmenitySaved()"

<!-- Amenity Modal -->
<div
  class="modal fade show d-block"
  *ngIf="showAmenityForm"
  tabindex="-1"
  style="background: rgba(0,0,0,0.5);">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">
          {{ isEditMode ? 'Edit Amenity' : 'Add Amenity' }}
        </h5>
        <button type="button" class="btn-close" (click)="closeForm()"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <app-amenity-form
          [amenityId]="selectedAmenityId"
          [isEditMode]="isEditMode"
          (formSubmitted)="onAmenitySaved()"
          (cancelled)="closeForm()">
        </app-amenity-form>
      </div>

    </div>
  </div>
</div>



<div *ngIf="!loading && filteredAmenities.length > 0" class="row">
  <div
    *ngFor="let amenity of filteredAmenities; index as i"
    class="col-md-4 mb-3">

    <div class="card h-100 shadow-sm amenity-card">

      <!-- Card Body -->
      <div class="card-body text-center">

        <!-- Icon -->
        <div class="amenity-icon mb-3">
            
          <i [class]="getAmenityIcon(amenity.name)"></i>
        </div>

        <!-- Name -->
        <h5 class="fw-bold">
          {{ amenity.name }}
        </h5>

        <!-- Description -->
        <p class="text-muted">
          {{ amenity.description }}
        </p>

        <!-- Status -->
        <span
          class="badge"
          [ngClass]="amenity.isActive ? 'bg-success' : 'bg-secondary'">
          {{ amenity.isActive ? 'Active' : 'Inactive' }}
        </span>

      </div>

      <!-- Card Footer Actions -->
      <div class="card-footer bg-white border-0 text-center">

        <button
          class="btn btn-sm btn-outline-primary me-2"
          (click)="editAmenity(amenity.amenityID)"
          title="Edit">
          <i class="bi bi-pencil"></i>
        </button>

        <button
          class="btn btn-sm btn-outline-warning me-2"
          (click)="toggleStatus(amenity)"
          title="Toggle Status">
          <i class="bi bi-toggle-on"></i>
        </button>

        <button
          class="btn btn-sm btn-outline-danger"
          (click)="deleteAmenity(amenity.amenityID)"
          title="Delete">
          <i class="bi bi-trash"></i>
        </button>

      </div>

    </div>
  </div>
</div>
<app-toast #toast></app-toast>
<div *ngIf="!loading && !filteredAmenities.length" class="text-center text-muted mt-5">
  <i class="bi bi-info-circle fs-1"></i>
  <p class="mt-3">No amenities available. Click "Add Amenity" to get started.</p>
</div>
