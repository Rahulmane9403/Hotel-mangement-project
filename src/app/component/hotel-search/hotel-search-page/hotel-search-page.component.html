<div class="container-fluid py-3">

  <!-- PAGE TITLE -->
  <div class="mb-3">
    <h4 class="fw-bold">🔍 Find Your Perfect Room</h4>
    <p class="text-muted mb-0">
      Search rooms by availability, price, amenities, and more
    </p>
  </div>
  <app-search-filters (search)="onSearch($event)">
  </app-search-filters>



  <div class="row">

    <!-- LEFT: FILTER PANEL -->
    <div class="col-lg-3 mb-3">
      <!-- SearchFiltersComponent will come here -->
      <div class="card shadow-sm">
        <div class="card-body">
          <p class="text-muted text-center mb-0">
            Filters coming next step
          </p>
        </div>
      </div>
    </div>

    <!-- RIGHT: RESULTS -->
    <div class="col-lg-9">

      <!-- LOADING -->
      <div *ngIf="loading" class="row g-3">
        <div class="col-md-6 col-xl-4" *ngFor="let i of [1,2,3,4,5,6]">
          <!-- Skeleton component later -->
          <div class="card placeholder-glow">
            <div class="card-body">
              <span class="placeholder col-12"></span>
              <span class="placeholder col-8"></span>
              <span class="placeholder col-6"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- ERROR -->
      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <!-- EMPTY STATE -->
      <div *ngIf="!loading && hasSearched && !rooms.length" class="text-center text-muted mt-5">
        <i class="bi bi-search fs-1"></i>
        <p class="mt-2">No rooms match your search criteria</p>
      </div>

      <!-- RESULTS -->
      <div *ngIf="!loading && rooms.length" class="row g-3">
        <!-- RoomCardComponent will come here -->
        <!-- <div class="col-md-6 col-xl-4" *ngFor="let room of rooms">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h6 class="fw-bold mb-1">
                Room {{ room.roomNumber }}
              </h6>
              <p class="mb-1 text-muted">
                {{ room.roomType.typeName }}
              </p>
              <p class="fw-semibold text-success mb-0">
                ₹ {{ room.price }}
              </p>
            </div>
          </div>
        </div> -->
        <div class="row g-3">

          <div class="col-md-4" *ngFor="let room of rooms">
            <app-room-card [room]="room" (viewDetails)="openRoomDetails($event)">
            </app-room-card>
          </div>

        </div>
      </div>

    </div>
  </div>

</div>
