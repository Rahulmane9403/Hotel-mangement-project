<div class="card shadow-sm h-100 room-card">

  <div class="card-body d-flex flex-column">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-start mb-2">
      <div>
        <h6 class="fw-bold mb-0">
          Room {{ room.roomNumber }}
        </h6>
        <small class="text-muted">
          {{ room.roomType.typeName }}
        </small>
      </div>

      <span class="badge" [ngClass]="getStatusClass()">
        {{ room.status }}
      </span>
    </div>

    <!-- DETAILS -->
    <div class="mb-2">
      <div class="small text-muted">
        <i class="bi bi-bed me-1"></i>{{ room.bedType }}
        &nbsp;•&nbsp;
        <i class="bi bi-eye me-1"></i>{{ room.viewType }}
      </div>
    </div>

    <!-- PRICE -->
    <div class="my-2">
      <span class="fs-5 fw-bold text-primary">
        ₹ {{ room.price | number:'1.0-0' }}
      </span>
      <small class="text-muted"> / night</small>
    </div>

    <!-- AMENITIES (PLACEHOLDER) -->
    <div class="d-flex gap-2 text-muted small mb-3">
      <i class="bi bi-wifi" title="WiFi"></i>
      <i class="bi bi-water" title="Pool"></i>
      <i class="bi bi-activity" title="Gym"></i>
    </div>

    <!-- CTA -->
    <div class="mt-auto">
      <button
        class="btn btn-outline-primary btn-sm w-100"
        (click)="onViewDetails()">
        View Details
      </button>
    </div>

  </div>

</div>
