<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">🏨 Room Management</h4>
    <button class="btn btn-primary btn-sm" (click)="openAddRoom()">
      <i class="bi bi-plus-circle me-1"></i> Add Room
    </button>
  </div>

  <!-- Modal Backdrop -->
  <div class="modal-backdrop fade show" *ngIf="showModal"></div>

  <!-- Modal -->
  <div class="modal fade show d-block" *ngIf="showModal" tabindex="-1" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <!-- <app-room-form [roomId]="selectedRoomId" [isEditMode]="isEditMode" (close)="onModalClose($event)">
          </app-room-form> -->
          <app-room-form [roomId]="selectedRoomId" (close)="onModalClose($event)">
          </app-room-form>

        </div>
      </div>
    </div>
  </div>

  <!-- Filters Card -->
  <div class="card mb-3">
    <div class="card-body d-flex gap-3 align-items-center flex-wrap">
      <input type="text" class="form-control form-control-sm w-25" placeholder="Search room..." [(ngModel)]="searchText"
        (input)="applyFilters()">

      <select class="form-select form-select-sm w-25" [(ngModel)]="selectedStatus" (change)="applyFilters()">
        <option value="">All Status</option>
        <option value="Available">Available</option>
        <option value="Occupied">Occupied</option>
        <option value="Under Maintenance">Under Maintenance</option>
      </select>

      <div class="form-check">
        <input class="form-check-input" type="checkbox" [(ngModel)]="showInactive" (change)="applyFilters()"
          id="inactiveToggle">
        <label class="form-check-label" for="inactiveToggle">
          Show Inactive
        </label>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Rooms Table -->
  <div class="table-responsive" *ngIf="!loading && filteredRooms.length">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Room No</th>
          <th>Room Type</th>
          <th class="text-end">Price</th>
          <th>Bed Type</th>
          <th>View</th>
          <th>Status</th>
          <th>Active</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let room of filteredRooms">
          <td class="fw-semibold">{{ room.roomNumber }}</td>
          <td>
            <!-- <span class="badge bg-secondary">{{ room.roomTypeID }}</span> -->
            <span class="badge bg-secondary">{{ room.typeName }}</span>
          </td>
          <td class="text-end">₹ {{ room.price | number:'1.0-0' }}</td>
          <td>{{ room.bedType }}</td>
          <td>{{ room.viewType }}</td>
          <td>
            <span class="badge" [ngClass]="{
              'bg-success': room.status === 'Available',
              'bg-danger': room.status === 'Occupied',
              'bg-warning': room.status === 'Under Maintenance'
            }">{{ room.status }}</span>
          </td>
          <td>
            <input type="checkbox" class="form-check-input" [checked]="room.isActive" (change)="toggleActive(room)" >
          </td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-primary me-1" (click)="editRoom(room.roomID)"title="Edit">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteRoom(room.roomID)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !filteredRooms.length" class="text-center mt-5">
    <p class="text-muted">No rooms found</p>
  </div>
</div>
